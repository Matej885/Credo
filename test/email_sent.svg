<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Obálka</title>
<defs>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fbfbfb"/>
    <stop offset="0.55" stop-color="#cfdcf2"/>
    <stop offset="1" stop-color="#7f9fd6"/>
  </linearGradient>
  <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2a5ba6"/>
    <stop offset="1" stop-color="#001e4b"/>
  </linearGradient>
</defs>
<style>
  #mail{animation:mail 6s infinite}
  #float{animation:float 1.8s ease-in-out infinite alternate}
  #flap{transform-box:fill-box;transform-origin:center top;animation:flap 6s infinite}
  @keyframes mail{
    0%{transform:translateX(-340px) rotate(-10deg);opacity:0;animation-timing-function:cubic-bezier(.2,.8,.3,1)}
    18%{transform:translateX(0) rotate(0);opacity:1}
    72%{transform:translateX(0) rotate(0);opacity:1;animation-timing-function:cubic-bezier(.6,0,.9,.4)}
    92%{transform:translateX(340px) rotate(8deg);opacity:1}
    100%{transform:translateX(340px) rotate(8deg);opacity:0}
  }
  @keyframes float{from{transform:translateY(-4px)}to{transform:translateY(4px)}}
  @keyframes flap{0%,30%,50%,100%{transform:scaleY(1)}38%,44%{transform:scaleY(.82)}}
</style>
<g id="mail">
  <ellipse cx="150" cy="262" rx="82" ry="8" fill="#001e4b" opacity=".15"/>
  <g id="float">
    <g stroke="#001e4b" stroke-width="5" stroke-linejoin="round">
      <rect x="40" y="90" width="220" height="140" rx="12" fill="url(#body)"/>
    </g>
    <path d="M44 226 L128 156 M256 226 L172 156" fill="none" stroke="#001e4b" stroke-width="3" stroke-linecap="round" opacity=".3"/>
    <path id="flap" d="M42 102 Q42 92 52 92 H248 Q258 92 258 102 L150 180 Z" fill="url(#flap)" stroke="#001e4b" stroke-width="5" stroke-linejoin="round"/>
  </g>
</g>
</svg>