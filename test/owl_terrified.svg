<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Sovička - error</title>
<style>
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
#owl{animation:glitch 2.4s infinite}
@keyframes glitch{0%,70%,100%{transform:translate(0,0)}72%{transform:translate(-5px,1px)}74%{transform:translate(5px,-2px)}76%{transform:translate(-4px,-1px)}78%{transform:translate(4px,2px)}80%{transform:translate(-2px,0)}82%{transform:translate(0,0)}}
.pup{animation:dart 1.2s steps(1) infinite}
@keyframes dart{0%{transform:translate(0,0)}20%{transform:translate(-9px,3px)}40%{transform:translate(9px,-3px)}60%{transform:translate(-6px,-6px)}80%{transform:translate(7px,5px)}}
#wing-l{transform-box:view-box;transform-origin:82px 150px;animation:tl .14s linear infinite alternate}
#wing-r{transform-box:view-box;transform-origin:218px 150px;animation:tr .14s linear infinite alternate}
@keyframes tl{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@keyframes tr{from{transform:rotate(3deg)}to{transform:rotate(-3deg)}}
.drop{animation:dr 1.6s ease-in infinite}
@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(16px);opacity:0}}
</style>
